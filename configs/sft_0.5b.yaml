# Основной запуск: SFT Qwen2.5-0.5B (base) + LoRA на Spider.
# Имя запуска: {тип}_{модель}_{данные}_{параметры}_s{seed}
run_name: sft_0.5b_nall_r16_lr1e-4_s42
model: Qwen/Qwen2.5-0.5B
method: lora              # lora | qlora | full
seed: 42

data:
  train: data/train.jsonl
  val: data/val.jsonl
train_size: null          # null = весь train; для эксперимента: 500 / 2000
val_size: 300             # валидация каждые eval_steps — держим небольшой

completion_only_loss: true   # loss только по SQL (эксперимент: false)

# Идея LoRA - к замороженной матрице весов W добавляется поправка B·A, где A и B — узкие матрицы ранга r. Обучаются только A и B.
lora:
  r: 16 # ранг (ширина поправки)
  alpha: 32 # масштаб поправки
  dropout: 0.05 # на каждом этапе случайно обнуляются 5% чисел (защита от переобучения)
  target_modules: all-linear

training:
  learning_rate: 1.0e-4   # для full FT: 2.0e-5
  num_train_epochs: 2
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 2
  max_length: 1024 # макс длина примера в токенах
  warmup_steps: 50 # первые 50 шагов lr плавно растёт
  lr_scheduler_type: cosine # после плавно спадает (вначале большие шаги, затем меньше)
  eval_steps: 100 # каждые 100 шагов - val loss
  logging_steps: 10 # каждые 10 шагов - train loss
  gradient_checkpointing: true

report_to: wandb          # wandb | tensorboard | none - куда класть метрики
wandb_project: base-vs-sft
hub_repo: null            # например <org>/qwen2.5-0.5b-spider-sft
